<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel Creator</title>
<style>
:root{--bg:#F1F2F6;--card:#fff;--text:#1B1E2B;--muted:#737A8C;--line:#E1E4EC;--accent:#3B5BDB;--danger:#C92A2A;--ok:#2B8A3E}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh}
.center{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 22px;max-width:380px;width:100%}
.panel h1{font-size:22px;margin-bottom:8px}
.muted{color:var(--muted)}.small{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:12px;padding:11px 18px;font:600 14px system-ui,sans-serif;cursor:pointer;margin-top:16px}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line);margin-top:0}
.btn.danger{background:transparent;color:var(--danger);border-color:#F1C8C8;margin-top:0}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px;margin-top:0}
.btn:disabled{opacity:.6}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:5}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.item.off{opacity:.65}
.otop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-weight:700}
.badge{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.badge.on{background:#E3F6E8;color:var(--ok)}
.badge.offb{background:#FBE4E4;color:var(--danger)}
.qrow{display:flex;justify-content:space-between;font-size:12px;margin:10px 0 4px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:end center;z-index:30}
.modal .box{background:var(--card);width:100%;max-width:520px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px 24px}
.modal h2{font-size:18px;margin-bottom:12px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--text)}
textarea{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:150px;resize:vertical}
.btns{display:flex;gap:10px;margin-top:18px}
.btns .btn{margin-top:0;flex:1}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw}
</style>
</head>
<body>
<section id="sLoad" class="center"><p class="muted">Memuat…</p></section>

<section id="sLogin" class="center" hidden>
  <div class="panel">
    <h1>Panel Creator</h1>
    <p class="muted">Khusus pembuat sistem. Masuk dengan akun Google creator.</p>
    <button id="bLogin" class="btn">Masuk dengan Google</button>
  </div>
</section>

<section id="sDenied" class="center" hidden>
  <div class="panel">
    <h1>Akses ditolak</h1>
    <p id="denMsg" class="muted"></p>
    <button id="bOut1" class="btn ghost" style="margin-top:16px">Keluar</button>
  </div>
</section>

<main id="sApp" hidden>
  <header class="top">
    <div><b>Panel Creator</b><div id="who" class="muted small"></div></div>
    <button id="bOut2" class="btn ghost sm">Keluar</button>
  </header>
  <div class="wrap">
    <div class="stats">
      <div class="stat"><b id="stOwner">0</b><span class="muted small">Owner</span></div>
      <div class="stat"><b id="stAktif">0</b><span class="muted small">Aktif</span></div>
      <div class="stat"><b id="stMb">0</b><span class="muted small">MB terpakai</span></div>
    </div>
    <div class="tools">
      <button id="bAdd" class="btn sm">+ Tambah owner</button>
      <button id="bExpOwner" class="btn ghost sm">Export owner (CSV)</button>
      <button id="bExpTesti" class="btn ghost sm">Export testimoni (CSV)</button>
    </div>
    <div id="rows"></div>
    <p id="empty" class="muted" style="text-align:center;padding:30px 0" hidden>Belum ada owner.</p>
  </div>
</main>

<div id="modalAdd" class="modal" hidden>
  <form id="formAdd" class="box" autocomplete="off">
    <h2>Tambah Owner</h2>
    <label for="aNama">Nama toko *</label>
    <input id="aNama" maxlength="60" required>
    <label for="aEmail">Email Google owner *</label>
    <input id="aEmail" type="email" placeholder="owner@gmail.com" required>
    <div class="btns">
      <button type="button" id="aCancel" class="btn ghost">Batal</button>
      <button type="submit" id="aSave" class="btn">Simpan</button>
    </div>
  </form>
</div>

<div id="modalCfg" class="modal" hidden>
  <div class="box">
    <h2 id="cfgTitle">config.js</h2>
    <p class="muted small" id="cfgHint">Tempel isi ini ke file <b>config.js</b> di repo website owner, lalu Commit.</p>
    <label for="cfgText">Isi config.js</label>
    <textarea id="cfgText" readonly></textarea>
    <div class="btns">
      <button id="cfgClose" class="btn ghost">Tutup</button>
      <button id="cfgCopy" class="btn">Salin</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
